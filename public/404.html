<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <title>องค์การนักเรียน โรงเรียนสาธิตมหาวิทยาลัยพะเยา</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, then redirects the browser
      // to index.html with the route encoded in the query parameter.

      // If project pages site (e.g. username.github.io/repo-name/), keep 1 segment
      // If custom domain or user page (e.g. domain.com or username.github.io), keep 0 segments
      var pathSegmentsToKeep = window.location.hostname.includes("github.io") ? 1 : 0;

      var l = window.location;
      var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPrefix + '/?/' +
        routePath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
